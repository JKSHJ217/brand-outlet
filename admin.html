<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<title>Admin - Brand Outlet</title>

<style>

body{
background:#111;
color:white;
font-family:Arial,sans-serif;
padding:40px;
}


.box{
max-width:500px;
margin:auto;
background:#1c1c1c;
padding:30px;
border-radius:20px;
}


h1{
text-align:center;
}


input, textarea{

width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
font-size:16px;

}


button{

width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:18px;

}


#adminPanel{
display:none;
}

</style>

</head>


<body>


<div class="box">


<div id="login">


<h1>
🔒 Вход
</h1>


<input id="password" type="password" placeholder="Пароль">


<button onclick="login()">
Войти
</button>


</div>



<div id="adminPanel">


<h1>
⌚ Добавить часы
</h1>


<input id="name" placeholder="Название часов">


<input id="price" placeholder="Цена TMT">


<input id="image" placeholder="Ссылка на фото">


<textarea id="description" placeholder="Описание"></textarea>


<button onclick="addWatch()">
Добавить товар
</button>


</div>


</div>




<script>


function login(){


let pass = document.getElementById("password").value;



if(pass === "12345"){


document.getElementById("login").style.display="none";

document.getElementById("adminPanel").style.display="block";


}

else{


alert("Неверный пароль ❌");


}


}


</script>




<script type="module">


import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyCc7DmnpKpSabioJg7F-vZ3ZywUfiTsnPQ",

authDomain: "brand-outlet-tm.firebaseapp.com",

projectId: "brand-outlet-tm",

storageBucket: "brand-outlet-tm.firebasestorage.app",

messagingSenderId: "1083598839585",

appId: "1:1083598839585:web:31d6c55768a25a60732860",

measurementId: "G-DTR2Y6C5YB"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



window.addWatch = async function(){


await addDoc(collection(db,"watches"),{


name:document.getElementById("name").value,

price:Number(document.getElementById("price").value),

image:document.getElementById("image").value,

description:document.getElementById("description").value


});


alert("Часы добавлены ✅");


location.reload();


}


</script>



</body>

</html>
