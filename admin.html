<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Brand Outlet Admin</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:40px;
}

h1{
    text-align:center;
}

.box{
    max-width:500px;
    margin:auto;
    background:#1c1c1c;
    padding:25px;
    border-radius:15px;
}

input, button{
    width:100%;
    padding:12px;
    margin-top:12px;
    border-radius:8px;
    border:none;
    box-sizing:border-box;
}

button{
    background:white;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

#status{
    text-align:center;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="box">

<h1>Brand Outlet Admin</h1>

<input id="name" placeholder="Название часов">

<input id="price" placeholder="Цена">

<input id="image" placeholder="Ссылка на фото">

<button onclick="addWatch()">Добавить часы</button>

<p id="status"></p>

</div>


<script type="module">

// Firebase подключим сюда после твоего firebaseConfig


function addWatch(){

let name = document.getElementById("name").value;
let price = document.getElementById("price").value;
let image = document.getElementById("image").value;


if(name === "" || price === "" || image === ""){

document.getElementById("status").innerHTML = "Заполни все поля";

return;

}


// Пока проверка работает без базы

document.getElementById("status").innerHTML = 
"Часы добавлены!";

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("image").value="";

}


</script>

</body>
</html>
