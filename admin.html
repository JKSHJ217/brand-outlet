<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Brand Outlet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
padding:30px;
}


.box{
max-width:700px;
margin:auto;
background:#1c1c1c;
padding:30px;
border-radius:20px;
}


h1,h2{
text-align:center;
margin-bottom:20px;
}


input,textarea{

width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:16px;

}


button{

width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:17px;

}


.add{

background:white;
color:black;

}


.login{

max-width:400px;
margin:100px auto;
background:#1c1c1c;
padding:30px;
border-radius:20px;
text-align:center;

}


.products{

margin-top:40px;

}


.item{

background:#222;
padding:20px;
border-radius:15px;
margin-top:20px;

}


.item img{

width:120px;
height:120px;
object-fit:cover;
border-radius:10px;

}


.actions{

display:flex;
gap:10px;

}


.edit{

background:#ddd;
color:black;

}


.delete{

background:#ff4444;
color:white;

}


.search{
width:100%;
padding:12px;
margin:15px 0;
border:none;
border-radius:10px;
font-size:16px;
background:#222;
color:white;
}

.search::placeholder{
color:#aaa;
}

.hidden{

display:none;

}

</style>

</head>


<body>


<div class="login" id="loginBox">

<h2>
🔒 Вход
</h2>


<input id="password" type="password" placeholder="Пароль">


<button onclick="login()">
Войти
</button>


</div>



<div class="box hidden" id="adminPanel">


<h1>
⚙️ Админ-панель
</h1>


<input id="name" placeholder="Название часов">


<input id="price" placeholder="Цена TMT">


<input id="stock" placeholder="Количество на складе">


<textarea id="images" placeholder="Ссылки на фото (каждая с новой строки)"></textarea>


<textarea id="description" placeholder="Описание"></textarea>


<button class="add" onclick="addWatch()">
➕ Добавить часы
</button>

<h2 style="margin-top:50px;">
    ⭐ Отзывы покупателей
</h2>

<div id="ratings">
    Загрузка отзывов...
</div>

<h2 style="margin-top:50px;">
    🆘 Обращения в поддержку
</h2>

<div id="support">
    Загрузка обращений...
</div>

<h2>
📦 Все часы
</h2>


<input
id="searchAdmin"
class="search"
type="text"
placeholder="🔍 Поиск часов..."
oninput="searchAdmin()">



<div class="products" id="products">

</div>


</div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
deleteDoc,
updateDoc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyCc7DmnpKpSabioJg7F-vZ3ZywUfiTsnPQ",

authDomain:"brand-outlet-tm.firebaseapp.com",

projectId:"brand-outlet-tm",

storageBucket:"brand-outlet-tm.firebasestorage.app",

messagingSenderId:"1083598839585",

appId:"1:1083598839585:web:31d6c55768a25a60732860"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


let editId = null;



window.login=function(){


let pass=document.getElementById("password").value;


if(pass==="YusupAli99361809453$"){


document.getElementById("loginBox").classList.add("hidden");

document.getElementById("adminPanel").classList.remove("hidden");


loadWatches();
loadRatings();
loadSupport();


}else{


alert("Неверный пароль ❌");


}


}




window.addWatch = async function(){


let images = document
.getElementById("images")
.value
.split("\n")
.filter(x=>x.trim()!=="");



let name = document.getElementById("name").value.trim();

let description = document.getElementById("description").value.trim();



const snapshot = await getDocs(collection(db,"watches"));


let duplicate = false;



snapshot.forEach((item)=>{


const watch = item.data();


if(
(watch.name || "").toLowerCase() === name.toLowerCase()
&&
(watch.description || "").toLowerCase() === description.toLowerCase()
){

duplicate = true;

}


});



if(duplicate){

alert("⚠️ Эти часы уже добавлены!");

return;

}




await addDoc(collection(db,"watches"),{


name:name,


price:Number(document.getElementById("price").value),


stock:Number(document.getElementById("stock").value),


images:images,


image:images[0],


description:description


});



alert("Часы добавлены ✅");


clearForm();

loadWatches();


}
async function loadWatches(){


const box=document.getElementById("products");


box.innerHTML="";


const snap=await getDocs(collection(db,"watches"));



snap.forEach((item)=>{


let watch=item.data();



box.innerHTML += `

<div class="item"
data-name="${(watch.name || "").toLowerCase()}"
data-price="${watch.price}"
data-description="${(watch.description || "").toLowerCase()}">


<img src="${watch.images ? watch.images[0] : watch.image}">


<h3>${watch.name}</h3>


<p>
${watch.price} TMT
</p>


<p>
📦 Сток: ${watch.stock || 0}
</p>



<div class="actions">


<button class="edit" onclick="editWatch('${item.id}')">

✏️ Изменить

</button>



<button class="delete" onclick="deleteWatch('${item.id}')">

🗑️ Удалить

</button>


</div>


</div>

`;

});


searchAdmin();

}

/* =========================
   ОТЗЫВЫ
========================= */

async function loadRatings(){

    const box = document.getElementById("ratings");

    box.innerHTML = "Загрузка отзывов...";

    try{

        const snap = await getDocs(
            collection(db, "ratings")
        );

        box.innerHTML = "";

        if(snap.empty){

            box.innerHTML = `
                <div class="item">
                    Пока отзывов нет ⭐
                </div>
            `;

            return;
        }

        snap.forEach((item)=>{

            const rating = item.data();

            const score = Number(rating.rating) || 0;

            const stars =
                "★".repeat(score) +
                "☆".repeat(5 - score);

            const email =
                rating.email || "Гость";

            const comment =
                rating.comment || "Без комментария";

            box.innerHTML += `

                <div class="item">

                    <p>
                        👤 ${email}
                    </p>

                    <h3 style="color:#ffd700;margin-top:10px;">
                        ${stars}
                    </h3>

                    <p style="margin-top:10px;color:#ccc;">
                        💬 ${comment}
                    </p>

                </div>

            `;

        });

    }catch(error){

        console.error(
            "Ошибка загрузки отзывов:",
            error
        );

        box.innerHTML = `
            <div class="item">
                ❌ Не удалось загрузить отзывы
            </div>
        `;

    }

}

/* =========================
   ПОДДЕРЖКА
========================= */

async function loadSupport(){

    const box =
        document.getElementById("support");

    box.innerHTML =
        "Загрузка обращений...";

    try{

        const snap =
            await getDocs(
                collection(db, "support")
            );

        box.innerHTML = "";

        if(snap.empty){

            box.innerHTML = `
                <div class="item">
                    Пока обращений нет 🆘
                </div>
            `;

            return;

        }

        snap.forEach((item)=>{

            const support =
                item.data();

            const name =
                support.name || "Не указано";

            const phone =
                support.phone || "Не указан";

            const email =
                support.email || "Гость";

            const topic =
                support.topic || "Другое";

            const message =
                support.message || "Без сообщения";


            box.innerHTML += `

                <div class="item">

                    <p>
                        👤 <strong>${name}</strong>
                    </p>

                    <p style="margin-top:8px;">
                        📱 ${phone}
                    </p>

                    <p style="margin-top:8px;">
                        📧 ${email}
                    </p>

                    <p style="margin-top:8px;">
                        📌 ${topic}
                    </p>

                    <p style="
                        margin-top:12px;
                        color:#ccc;
                    ">
                        💬 ${message}
                    </p>

                </div>

            `;

        });

    }catch(error){

        console.error(
            "Ошибка загрузки поддержки:",
            error
        );

        box.innerHTML = `
            <div class="item">
                ❌ Не удалось загрузить обращения
            </div>
        `;

    }

}

window.deleteWatch = async function(id){


let ok = confirm("Удалить эти часы?");


if(!ok) return;



await deleteDoc(doc(db,"watches",id));


alert("Часы удалены 🗑️");


loadWatches();


}





window.editWatch = async function(id){


const snap = await getDoc(doc(db,"watches",id));


if(snap.exists()){


const watch = snap.data();


document.getElementById("name").value = watch.name;


document.getElementById("price").value = watch.price;


document.getElementById("stock").value = watch.stock || 0;


document.getElementById("images").value =
(watch.images || []).join("\n");


document.getElementById("description").value =
watch.description || "";



editId=id;



document.querySelector(".add").innerText =
"💾 Сохранить изменения";



document.querySelector(".add").onclick =
saveEdit;



}


}







async function saveEdit(){



let images = document
.getElementById("images")
.value
.split("\n")
.filter(x=>x.trim()!=="");



await updateDoc(doc(db,"watches",editId),{


name:document.getElementById("name").value,


price:Number(document.getElementById("price").value),


stock:Number(document.getElementById("stock").value),


images:images,


image:images[0],


description:document.getElementById("description").value


});



alert("Изменения сохранены ✅");


editId=null;


document.querySelector(".add").innerText =
"➕ Добавить часы";


document.querySelector(".add").onclick =
addWatch;



clearForm();


loadWatches();


}






window.searchAdmin=function(){


const text=document
.getElementById("searchAdmin")
.value
.toLowerCase()
.trim();



const items=document.querySelectorAll(".item");



items.forEach(item=>{


const name=item.dataset.name || "";

const price=item.dataset.price || "";

const description=item.dataset.description || "";



if(
name.includes(text) ||
price.includes(text) ||
description.includes(text)
){


item.style.display="";


}else{


item.style.display="none";


}



});


}






function clearForm(){


document.getElementById("name").value="";


document.getElementById("price").value="";


document.getElementById("stock").value="";


document.getElementById("images").value="";


document.getElementById("description").value="";


}



</script>


</body>

</html>
