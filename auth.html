<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — brand_outlet.tm</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="style.css"></head><body><main class="section"><div class="panel" style="max-width:500px;margin:auto"><a href="index.html">← На главную</a><h1>👤 Аккаунт</h1><input id="email" class="field" type="email" placeholder="Email"><input id="password" class="field" type="password" placeholder="Пароль"><div class="actions"><button class="primary" onclick="login()">Войти</button><button class="secondary" onclick="register()">Регистрация</button></div><p id="msg" class="muted"></p></div></main><script src="app.js"></script><script type="module" src="firebase.js"></script><script type="module">
import "./firebase.js";window.login=async()=>{try{await store.signInWithEmailAndPassword(store.auth,email.value,password.value);location.href="account.html"}catch(e){msg.textContent=e.message}};window.register=async()=>{try{await store.createUserWithEmailAndPassword(store.auth,email.value,password.value);location.href="account.html"}catch(e){msg.textContent=e.message}};
</script></body></html>
