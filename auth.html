<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auth - brand_outlet.tm</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.box{
width:100%;
max-width:400px;
background:#1c1c1c;
padding:30px;
border-radius:20px;
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:16px;
}

button{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;

}

.register{
background:white;
color:black;
}

.login{
background:#333;
color:white;
}

.back{
background:#222;
color:white;
}

.message{
text-align:center;
margin-top:15px;
color:#aaa;
}

</style>

</head>


<body>


<div class="box">


<h1>
👤 <span data-lang="account">Аккаунт</span>
</h1>


<input 
id="email"
type="email"
data-lang-placeholder="email"
placeholder="Email">


<input 
id="password"
type="password"
data-lang-placeholder="password"
placeholder="Пароль">


<input 
id="confirmPassword"
type="password"
data-lang-placeholder="confirmPassword"
placeholder="Повторите пароль">



<button class="register" onclick="register()">

📝 <span data-lang="register">
Зарегистрироваться
</span>

</button>



<button class="login" onclick="login()">

🔑 <span data-lang="login">
Войти
</span>

</button>



<button class="back" onclick="location.href='index.html'">

🏠 <span data-lang="home">
Главная
</span>

</button>



<div class="message" id="message"></div>


</div>




<script src="language.js"></script>


<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import { 
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
} 
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";



const firebaseConfig = {

apiKey:"AIzaSyCc7DmnpKpSabioJg7F-vZ3ZywUfiTsnPQ",

authDomain:"brand-outlet-tm.firebaseapp.com",

projectId:"brand-outlet-tm",

storageBucket:"brand-outlet-tm.firebasestorage.app",

messagingSenderId:"1083598839585",

appId:"1:1083598839585:web:31d6c55768a25a60732860"

};



const app = initializeApp(firebaseConfig);

const auth = getAuth(app);



const message=document.getElementById("message");



function text(key){

let lang=localStorage.getItem("siteLang") || "ru";

return translations[lang][key];

}



window.register = async function(){


let email=document.getElementById("email").value;

let password=document.getElementById("password").value;

let confirm=document.getElementById("confirmPassword").value;



if(!email || !password || !confirm){

message.innerHTML=text("fillFields");

return;

}



if(password!==confirm){

message.innerHTML=text("passwordError");

return;

}



try{


await createUserWithEmailAndPassword(
auth,
email,
password
);


message.innerHTML=text("registerSuccess");


setTimeout(()=>{

location.href="account.html";

},1000);



}catch(error){

message.innerHTML=error.message;

}



}



window.login = async function(){


let email=document.getElementById("email").value;

let password=document.getElementById("password").value;



if(!email || !password){

message.innerHTML=text("enterLogin");

return;

}



try{


await signInWithEmailAndPassword(
auth,
email,
password
);



message.innerHTML=text("loginSuccess");



setTimeout(()=>{

location.href="account.html";

},1000);



}catch(error){


message.innerHTML=text("wrongLogin");


}


}



</script>


</body>

</html>
