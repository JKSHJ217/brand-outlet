<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<title>Избранное - Brand Outlet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}


header{

background:#000;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;

}


.logo{

font-size:28px;
font-weight:bold;

}


a{

color:white;
text-decoration:none;

}


.favorites{

padding:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;

}


.card{

background:#1c1c1c;
border-radius:20px;
padding:20px;
text-align:center;

}


.card img{

width:100%;
border-radius:15px;
cursor:pointer;

}


.card h2{

cursor:pointer;
margin-top:15px;

}


.price{

font-size:24px;
margin:15px;

}


button{

width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;

}


.cart{

background:white;
color:black;

}


.remove{

background:#ff5555;
color:white;

}


</style>

</head>


<body>


<header>


<div class="logo">
brand_outlet.tm
</div>



<div style="display:flex;gap:20px;">


<a href="index.html">
🏠 Главная
</a>


<a href="cart.html">
🛒 Корзина
</a>


</div>


</header>




<h1 style="text-align:center;margin:30px;">
❤️ Избранное
</h1>




<section class="favorites" id="favBox">

</section>



<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import { 
getFirestore,
collection,
getDocs
} 
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyCc7DmnpKpSabioJg7F-vZ3ZywUfiTsnPQ",

authDomain: "brand-outlet-tm.firebaseapp.com",

projectId: "brand-outlet-tm",

storageBucket: "brand-outlet-tm.firebasestorage.app",

messagingSenderId: "1083598839585",

appId: "1:1083598839585:web:31d6c55768a25a60732860"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



const favBox=document.getElementById("favBox");


let favorites = JSON.parse(localStorage.getItem("favorites")) || [];



const snapshot = await getDocs(collection(db,"watches"));



snapshot.forEach((doc)=>{


if(favorites.includes(doc.id)){


const watch=doc.data();


favBox.innerHTML += `


<div class="card">


<div onclick="openWatch('${doc.id}')">


<img src="${watch.images ? watch.images[0] : watch.image}">


<h2>
${watch.name}
</h2>


</div>



<div class="price">
${watch.price} TMT
</div>



<button class="cart" onclick="addToCart('${doc.id}')">
🛒 В корзину
</button>



<button class="remove" onclick="removeFavorite('${doc.id}')">
❌ Удалить
</button>


</div>


`;


}


});



if(favBox.innerHTML===""){

favBox.innerHTML="<h2>Избранное пустое ❤️</h2>";

}

<script>

function openWatch(id){

window.location.href="watch.html?id="+id;

}



function addToCart(id){


let cart = JSON.parse(localStorage.getItem("cart")) || [];


let item = cart.find(x=>x.id===id);



if(item){

item.quantity++;

}else{


cart.push({

id:id,

quantity:1

});


}



localStorage.setItem(
"cart",
JSON.stringify(cart)
);



alert("Добавлено в корзину 🛒");


}





function removeFavorite(id){


let favorites = JSON.parse(localStorage.getItem("favorites")) || [];


favorites = favorites.filter(item=>item!==id);



localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);



location.reload();


}


</script>


<script src="counter.js"></script>


</body>

</html>
