<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Избранное — brand_outlet.tm</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="style.css"></head><body><header class="navbar-store"><div class="inner"><a class="logo-text" href="index.html">brand_outlet.tm</a><nav class="navlinks"><a href="catalog.html">Каталог</a><a href="cart.html">🛒 <span data-cart-count>0</span></a><a href="account.html">👤 Аккаунт</a></nav></div></header><main class="section"><h1>❤️ Избранное</h1><div id="products" class="grid"></div></main><script src="app.js"></script><script>
document.addEventListener("DOMContentLoaded",()=>{const a=getFav();document.getElementById("products").innerHTML=a.length?a.map(x=>`<article class="card"><img src="${escapeHtml(x.image||"images/product-item1.jpg")}"><div class="card-body"><h3>${escapeHtml(x.name)}</h3><div class="price">${money(x.price)}</div><div class="actions"><button class="primary" onclick='addToCart(${JSON.stringify(x).replace(/'/g,"&#39;")})'>В корзину</button><button class="secondary" onclick="removeFav('${String(x.id).replace(/'/g,"\\'")}')">Убрать</button></div></div></article>`).join(""):'<p class="muted">В избранном пока ничего нет.</p>'});function removeFav(id){let a=getFav().filter(x=>String(x.id)!==String(id));saveFav(a);location.reload()}
</script></body></html>
