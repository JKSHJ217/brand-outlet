<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Товар — brand_outlet.tm</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="style.css"></head><body><header class="navbar-store"><div class="inner"><a class="logo-text" href="index.html">brand_outlet.tm</a><nav class="navlinks"><a href="catalog.html">Каталог</a><a href="favorites.html">❤️ <span data-fav-count>0</span></a><a href="cart.html">🛒 <span data-cart-count>0</span></a><a href="account.html">👤 Аккаунт</a></nav></div></header><main class="section"><div id="product" class="two"></div></main><script src="app.js"></script><script type="module" src="firebase.js"></script><script type="module">
import "./firebase.js"; window.addEventListener("load",async()=>{const id=new URLSearchParams(location.search).get("id");if(!id)return;try{const s=await store.getDoc(store.doc(store.db,"watches",id));if(!s.exists()){document.getElementById("product").innerHTML="<p>Товар не найден.</p>";return}const x={id:s.id,...s.data()};const img=Array.isArray(x.images)?x.images[0]:(x.image||"images/product-item1.jpg");const item={id:x.id,name:x.name||"Часы",price:x.price||0,image:img};document.getElementById("product").innerHTML=`<div class="panel"><img src="${escapeHtml(img)}" style="width:100%;max-height:650px;object-fit:contain;border-radius:12px"></div><div class="panel"><div class="muted">WATCH</div><h1>${escapeHtml(item.name)}</h1><div class="price">${money(item.price)}</div><p class="muted">${escapeHtml(x.description||"Премиальные часы.")}</p><button class="primary" onclick='addToCart(${JSON.stringify(item).replace(/'/g,"&#39;")})'>Добавить в корзину</button><button class="icon-btn" onclick='toggleFav(${JSON.stringify(item).replace(/'/g,"&#39;")})'>♡ В избранное</button></div>`}catch(e){console.error(e)}})</script></body></html>
