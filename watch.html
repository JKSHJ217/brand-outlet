<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Часы - Brand Outlet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}


header{
background:#000;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}


.logo{
font-size:28px;
font-weight:bold;
}


a{
color:white;
text-decoration:none;
}


.container{

max-width:900px;
margin:auto;
padding:40px;

}


.main-img{

width:100%;
max-height:500px;
object-fit:contain;
background:#1c1c1c;
border-radius:20px;

}


.gallery{

display:grid;
grid-template-columns:repeat(6,1fr);
gap:10px;
margin-top:20px;

}


.gallery img{

width:100%;
height:90px;
object-fit:cover;
border-radius:10px;
cursor:pointer;

}


.gallery img:hover{

opacity:0.7;

}


h1{

margin-top:30px;

}


.price{

font-size:30px;
margin:20px 0;

}


.description{

color:#ccc;
font-size:18px;
margin-bottom:20px;

}


button{

width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;

}


.cart{

background:white;
color:black;

}


.fav{

background:#333;
color:white;

}


</style>

</head>


<body>


<header>


<div class="logo">
brand_outlet.tm
</div>


<div>

<a href="index.html">
🏠 Главная
</a>

</div>


</header>



<div class="container">


<img id="mainImage" class="main-img">



<div class="gallery" id="gallery"></div>



<h1 id="name">
</h1>



<div class="price" id="price">
</div>



<div class="description" id="description">
</div>



<button class="cart" id="cartBtn">
🛒 В корзину
</button>



<button class="fav" id="favBtn">
❤️ В избранное
</button>


</div>





<script type="module">


import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyCc7DmnpKpSabioJg7F-vZ3ZywUfiTsnPQ",

authDomain: "brand-outlet-tm.firebaseapp.com",

projectId: "brand-outlet-tm",

storageBucket: "brand-outlet-tm.firebasestorage.app",

messagingSenderId: "1083598839585",

appId: "1:1083598839585:web:31d6c55768a25a60732860"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



const params = new URLSearchParams(window.location.search);

const id = params.get("id");



const snap = await getDoc(doc(db,"watches",id));


if(snap.exists()){


const watch = snap.data();



document.getElementById("name").innerText = watch.name;


document.getElementById("price").innerText = watch.price + " TMT";


document.getElementById("description").innerText = watch.description || "";



let images = watch.images || [watch.image];



document.getElementById("mainImage").src = images[0];



const gallery = document.getElementById("gallery");



images.forEach((img)=>{


gallery.innerHTML += `

<img src="${img}" onclick="changeImage('${img}')">

`;


});


window.changeImage = function(img){

document.getElementById("mainImage").src = img;

}



document.getElementById("cartBtn").onclick=function(){


let cart = JSON.parse(localStorage.getItem("cart")) || [];


if(!cart.includes(id)){

cart.push(id);

}


localStorage.setItem("cart",JSON.stringify(cart));


alert("Добавлено в корзину 🛒");


}



document.getElementById("favBtn").onclick=function(){


let favorites = JSON.parse(localStorage.getItem("favorites")) || [];


if(!favorites.includes(id)){

favorites.push(id);

}


localStorage.setItem("favorites",JSON.stringify(favorites));


alert("Добавлено в избранное ❤️");


}



}


</script>


</body>

</html>
