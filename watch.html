<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brand Outlet - Часы</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:#000;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

a{
color:white;
text-decoration:none;
}

.container{
max-width:900px;
margin:auto;
padding:40px;
}

.photo-box{
position:relative;
display:flex;
justify-content:center;
align-items:center;
}

.main-img{
width:100%;
height:500px;
object-fit:contain;
background:#1c1c1c;
border-radius:20px;
}

.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
background:white;
color:black;
border:none;
width:50px;
height:50px;
border-radius:50%;
font-size:30px;
cursor:pointer;
}

.left{
left:20px;
}

.right{
right:20px;
}

.gallery{
display:flex;
gap:10px;
margin-top:20px;
overflow-x:auto;
}

.gallery img{
width:90px;
height:90px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
}

h1{
margin-top:30px;
}

.price{
font-size:30px;
margin:20px 0;
}

.description{
color:#ccc;
font-size:18px;
}


.quantity{
text-align:center;
font-size:22px;
margin:20px;
}

.quantity button{

width:45px;
height:40px;
font-size:25px;
cursor:pointer;

}


.action{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;

}


.cart{
background:white;
color:black;
}


.fav{
background:#333;
color:white;
}


</style>

</head>


<body>


<header>

<div class="logo">
brand_outlet.tm
</div>

<a href="index.html">
🏠 Главная
</a>

</header>



<div class="container">


<div class="photo-box">

<button class="arrow left" onclick="prevPhoto()">
⬅️
</button>


<img id="mainImage" class="main-img">


<button class="arrow right" onclick="nextPhoto()">
➡️
</button>


</div>



<div class="gallery" id="gallery"></div>



<h1 id="name"></h1>


<div class="price" id="price"></div>


<div class="description" id="description"></div>



<div class="quantity">

Количество:

<button onclick="minusCount()">-</button>

<span id="quantity">1</span>

<button onclick="plusCount()">+</button>

</div>



<button class="action cart" id="cartBtn">
🛒 В корзину
</button>


<button class="action fav" id="favBtn">
❤️ В избранное
</button>


</div>





<script type="module">


import {initializeApp} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyCc7DmnpKpSabioJg7F-vZ3ZywUfiTsnPQ",

authDomain:"brand-outlet-tm.firebaseapp.com",

projectId:"brand-outlet-tm",

storageBucket:"brand-outlet-tm.firebasestorage.app",

messagingSenderId:"1083598839585",

appId:"1:1083598839585:web:31d6c55768a25a60732860"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);



const id=new URLSearchParams(location.search).get("id");



let images=[];

let current=0;

let quantity=1;



const snap=await getDoc(doc(db,"watches",id));



if(snap.exists()){


const watch=snap.data();


document.getElementById("name").innerText=watch.name;

document.getElementById("price").innerText=watch.price+" TMT";

document.getElementById("description").innerText=watch.description || "";


images=watch.images || [watch.image];


showPhoto();



images.forEach((img,index)=>{

gallery.innerHTML += `

<img src="${img}" onclick="selectPhoto(${index})">

`;

});


}




function showPhoto(){

document.getElementById("mainImage").src=images[current];

}



window.nextPhoto=function(){

current++;

if(current>=images.length){

current=0;

}

showPhoto();

}



window.prevPhoto=function(){

current--;

if(current<0){

current=images.length-1;

}

showPhoto();

}



window.selectPhoto=function(index){

current=index;

showPhoto();

}



window.plusCount=function(){

quantity++;

document.getElementById("quantity").innerText=quantity;

}



window.minusCount=function(){

if(quantity>1){

quantity--;

}

document.getElementById("quantity").innerText=quantity;

}




document.getElementById("cartBtn").onclick=function(){


let cart=JSON.parse(localStorage.getItem("cart")) || [];


let item=cart.find(x=>x.id===id);



if(item){

item.quantity += quantity;

}else{


cart.push({

id:id,

quantity:quantity

});


}


localStorage.setItem("cart",JSON.stringify(cart));


alert("Добавлено в корзину 🛒");


}




document.getElementById("favBtn").onclick=function(){


let fav=JSON.parse(localStorage.getItem("favorites")) || [];


if(!fav.includes(id)){

fav.push(id);

}


localStorage.setItem("favorites",JSON.stringify(fav));


alert("Добавлено в избранное ❤️");


}


</script>

<script src="counter.js"></script>

</body>

</html>
