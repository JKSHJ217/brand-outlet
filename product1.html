<script>

const images = [
"https://f.bflcdn.com/f_auto,q_auto/products/26/7/4549526132575_FRONT_1.JPG",
"https://f.bflcdn.com/f_auto,q_auto/products/26/7/4549526132575_1.JPG",
"https://f.bflcdn.com/f_auto,q_auto/products/26/7/4549526132575_ANGLE_1.JPG",
"https://f.bflcdn.com/f_auto,q_auto/products/26/7/4549526132575_BACK_1.JPG",
"https://f.bflcdn.com/f_auto,q_auto/products/26/7/4549526132575_BOX.JPG",
"https://f.bflcdn.com/f_auto,q_auto/products/26/7/4549526132575_SIDE_1.JPG"
];

let currentImage = 0;

function changeImage(src){
    document.getElementById("mainImage").src = src;
    currentImage = images.indexOf(src);
}

function nextImage(){
    currentImage++;
    if(currentImage >= images.length){
        currentImage = 0;
    }
    document.getElementById("mainImage").src = images[currentImage];
}

function prevImage(){
    currentImage--;
    if(currentImage < 0){
        currentImage = images.length - 1;
    }
    document.getElementById("mainImage").src = images[currentImage];
}

</script>
