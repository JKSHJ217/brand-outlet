<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Аккаунт - brand_outlet.tm</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:30px;
}

.profile{
background:#1c1c1c;
padding:25px;

}

.avatar{

}

button,.item{
width:100%;
background:#1c1c1c;
color:white;
border:none;
padding:18px;
margin:8px 0;
border-radius:15px;
font-size:17px;
text-align:left;
cursor:pointer;
}

.item:hover{
background:#292929;
}

.section{
margin-top:25px;
font-size:14px;
color:#aaa;
}

a{
color:white;
text-decoration:none;
}

</style>

</head>


<body>

<div class="container">


<h1>
👤 Аккаунт
</h1>

<a href="index.html">
<button>
🏠 Главная
</button>
</a>

<div class="profile">

<div class="avatar">
👤
</div>

<h2 id="userName">
Гость
</h2>

<p id="userText">
Войдите, чтобы использовать аккаунт
</p>

<br>

<button id="authButton" onclick="location.href='auth.html'">
🔑 Войти / Регистрация
</button>

<button id="logoutButton" style="display:none;" onclick="logout()">
🚪 Выйти
</button>

</div>



<div class="section">
🛍️ Покупки
</div>


<a href="cart.html">
<div class="item">
🛒 Корзина
</div>
</a>


<a href="favorites.html">
<div class="item">
❤️ Избранное
</div>
</a>


<a href="orders.html">
<div class="item">
📦 Мои заказы
</div>
</a>




<div class="section">
⚙️ Настройки
</div>


<div class="item">
🌐 Язык
</div>


<div class="item">
🎨 Оформление
</div>




<div class="section">
🔒 Безопасность
</div>


<div class="item">
🔐 Конфиденциальность
</div>


<div class="item">
📜 Условия использования
</div>




<div class="section">
ℹ️ Информация
</div>


<div class="item">
ℹ️ О приложении
</div>


<div class="item">
⭐ Оценить сайт
</div>



</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


const firebaseConfig = {

apiKey:"AIzaSyCc7DmnpKpSabioJg7F-vZ3ZywUfiTsnPQ",

authDomain:"brand-outlet-tm.firebaseapp.com",

projectId:"brand-outlet-tm",

storageBucket:"brand-outlet-tm.firebasestorage.app",

messagingSenderId:"1083598839585",

appId:"1:1083598839585:web:31d6c55768a25a60732860"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);



onAuthStateChanged(auth,(user)=>{


if(user){


document.getElementById("userName").innerHTML =
"👤 " + user.email;


document.getElementById("userText").innerHTML =
"Вы вошли в аккаунт";


document.getElementById("authButton").style.display="none";


document.getElementById("logoutButton").style.display="block";


}else{


document.getElementById("userName").innerHTML =
"Гость";


document.getElementById("userText").innerHTML =
"Войдите, чтобы использовать аккаунт";


document.getElementById("authButton").style.display="block";


document.getElementById("logoutButton").style.display="none";


}


});



window.logout=function(){


signOut(auth).then(()=>{


location.reload();


});


}


</script>


</body>

</html>
