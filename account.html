<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


const firebaseConfig = {

apiKey:"AIzaSyCc7DmnpKpSabioJg7F-vZ3ZywUfiTsnPQ",

authDomain:"brand-outlet-tm.firebaseapp.com",

projectId:"brand-outlet-tm",

storageBucket:"brand-outlet-tm.firebasestorage.app",

messagingSenderId:"1083598839585",

appId:"1:1083598839585:web:31d6c55768a25a60732860"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);



onAuthStateChanged(auth,(user)=>{


if(user){


document.getElementById("userName").innerHTML =
"👤 " + user.email;


document.getElementById("userText").innerHTML =
"Вы вошли в аккаунт";


document.getElementById("authButton").style.display="none";


document.getElementById("logoutButton").style.display="block";


}else{


document.getElementById("userName").innerHTML =
"Гость";


document.getElementById("userText").innerHTML =
"Войдите, чтобы использовать аккаунт";


document.getElementById("authButton").style.display="block";


document.getElementById("logoutButton").style.display="none";


}


});



window.logout=function(){


signOut(auth).then(()=>{


location.reload();


});


}


</script>



<script>


function toggleLangMenu(){


const menu=document.getElementById("langMenu");


menu.style.display =
menu.style.display==="none"
?
"block"
:
"none";


}




function setLanguage(code,label){


localStorage.setItem("siteLang",code);


localStorage.setItem("siteLangLabel",label);



document.getElementById("currentLang").innerText=label;



document.getElementById("langMenu").style.display="none";



if(window.applyLanguage){

applyLanguage();

}


}



document.addEventListener("DOMContentLoaded",()=>{


const savedLabel =
localStorage.getItem("siteLangLabel")
||
"Русский";


document.getElementById("currentLang").innerText=savedLabel;



});



</script>



<script src="language.js"></script>
