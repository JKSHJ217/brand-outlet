<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Корзина — brand_outlet.tm</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="style.css"></head><body><header class="navbar-store"><div class="inner"><a class="logo-text" href="index.html">brand_outlet.tm</a><nav class="navlinks"><a href="catalog.html">Каталог</a><a href="favorites.html">Избранное</a><a href="account.html">Аккаунт</a></nav></div></header><main class="section"><h1>🛒 Корзина</h1><div id="cart"></div></main><footer>© 2026 brand_outlet.tm</footer><script src="app.js"></script><script>
function renderCart(){const c=getCart(),r=document.getElementById("cart");if(!c.length){r.innerHTML='<div class="panel">Корзина пуста.<br><br><a class="primary" href="catalog.html">Перейти в каталог</a></div>';return}let total=0;r.innerHTML=c.map((x,i)=>{total+=(Number(x.price)||0)*(x.qty||1);return `<div class="panel" style="display:flex;gap:18px;align-items:center;margin:12px 0"><img src="${escapeHtml(x.image||"images/product-item1.jpg")}" style="width:100px;height:100px;object-fit:cover;border-radius:10px"><div style="flex:1"><h3>${escapeHtml(x.name)}</h3><p>${money(x.price)} × ${x.qty}</p><button class="secondary" onclick="changeQty(${i},-1)">−</button> <button class="secondary" onclick="changeQty(${i},1)">+</button> <button class="secondary" onclick="removeItem(${i})">Удалить</button></div></div>`}).join("")+`<div class="panel"><h2>Итого: ${money(total)}</h2><a class="primary" href="checkout.html">Оформить заказ</a></div>`}
function changeQty(i,d){let c=getCart();c[i].qty=Math.max(1,(c[i].qty||1)+d);saveCart(c);renderCart()}function removeItem(i){let c=getCart();c.splice(i,1);saveCart(c);renderCart()}document.addEventListener("DOMContentLoaded",renderCart)
</script></body></html>
