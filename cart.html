<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<title>Корзина - Brand Outlet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}


header{

background:#000;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;

}


.logo{

font-size:28px;
font-weight:bold;

}


a{

color:white;
text-decoration:none;

}


.cart{

padding:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;

}


.card{

background:#1c1c1c;
border-radius:20px;
padding:20px;
text-align:center;

}


.card img{

width:100%;
border-radius:15px;

}


.price{

font-size:24px;
margin:15px;

}


button{

width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;

}


.remove{

background:#ff5555;
color:white;

}


</style>

</head>


<body>



<header>

<div class="logo">
brand_outlet.tm
</div>


<div style="display:flex;gap:20px;">


<a href="index.html">
🏠 Главная
</a>


<a href="favorites.html">
❤️ Избранное
</a>


</div>


</header>




<h1 style="text-align:center;margin:30px;">
🛒 Корзина
</h1>



<section class="cart">

</section>




<script type="module">


import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyCc7DmnpKpSabioJg7F-vZ3ZywUfiTsnPQ",

authDomain: "brand-outlet-tm.firebaseapp.com",

projectId: "brand-outlet-tm",

storageBucket: "brand-outlet-tm.firebasestorage.app",

messagingSenderId: "1083598839585",

appId: "1:1083598839585:web:31d6c55768a25a60732860",

measurementId: "G-DTR2Y6C5YB"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



const cartBox = document.querySelector(".cart");



let cart = JSON.parse(localStorage.getItem("cart")) || [];



const snapshot = await getDocs(collection(db,"watches"));



snapshot.forEach((doc)=>{


if(cart.includes(doc.id)){


const watch = doc.data();



cartBox.innerHTML += `


<div class="card">


<img src="${watch.image}">


<h2>
${watch.name}
</h2>


<div class="price">
${watch.price} TMT
</div>


<button class="remove" onclick="removeCart('${doc.id}')">
❌ Удалить
</button>


</div>


`;

}


});



if(cartBox.innerHTML === ""){

cartBox.innerHTML = "<h2>Корзина пустая 🛒</h2>";

}



</script>



<script>


function removeCart(id){


let cart = JSON.parse(localStorage.getItem("cart")) || [];


cart = cart.filter(item => item !== id);


localStorage.setItem("cart",JSON.stringify(cart));


location.reload();


}


</script>



</body>

</html>
