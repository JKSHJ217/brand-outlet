<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Корзина - Brand Outlet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:#000;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

a{
color:white;
text-decoration:none;
}


.cart{
max-width:1000px;
margin:auto;
padding:40px;
display:flex;
flex-direction:column;
gap:25px;
}


.card{

background:#1c1c1c;
border-radius:20px;
padding:20px;
display:flex;
align-items:center;
gap:20px;

}


.card img{

width:160px;
height:160px;
object-fit:cover;
border-radius:15px;

}


.info{

flex:1;

}


.info h2{

margin-bottom:10px;

}


.price{

font-size:22px;
margin:10px 0;

}


.quantity{

display:flex;
align-items:center;
gap:15px;
margin-top:15px;

}


.quantity button{

width:40px;
height:40px;
font-size:24px;
border:none;
border-radius:10px;
cursor:pointer;

}


.remove{

margin-top:15px;
background:#ff4444;
color:white;
border:none;
padding:10px 20px;
border-radius:10px;
cursor:pointer;

}


.total{

max-width:1000px;
margin:20px auto;
background:#1c1c1c;
padding:25px;
border-radius:20px;
font-size:25px;
text-align:right;

}


.checkout{

margin-top:20px;
width:100%;
padding:15px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;

}


</style>

</head>


<body>


<header>

<div class="logo">
brand_outlet.tm
</div>


<div style="display:flex;gap:20px;">

<a href="index.html">
🏠 Главная
</a>


<a href="favorites.html">
❤️ Избранное
</a>


</div>

</header>



<h1 style="text-align:center;margin:30px;">
🛒 Корзина
</h1>



<section class="cart" id="cart">

</section>



<div class="total">

Общая сумма:
<span id="totalPrice">0</span> TMT


<button class="checkout">
🛍 Оформить заказ
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyCc7DmnpKpSabioJg7F-v7Z3ywUfiTsnPQ",

authDomain:"brand-outlet-tm.firebaseapp.com",

projectId:"brand-outlet-tm",

storageBucket:"brand-outlet-tm.firebasestorage.app",

messagingSenderId:"1083598839585",

appId:"1:1083598839585:web:31d6c55768a25a60732860"

};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


const cartBox = document.getElementById("cart");
const totalPrice = document.getElementById("totalPrice");


let cart = JSON.parse(localStorage.getItem("cart")) || [];




const snapshot = await getDocs(collection(db,"watches"));


function renderCart(){

cartBox.innerHTML="";

let total=0;


snapshot.forEach((doc)=>{


let item = cart.find(x=>x.id===doc.id);


if(item){


let watch = doc.data();


let sum = watch.price * item.quantity;


total += sum;



cartBox.innerHTML += `

<div class="card">

<img src="${watch.images ? watch.images[0] : watch.image}">


<div class="info">

<h2>${watch.name}</h2>


<div class="price">
Цена: ${watch.price} TMT
</div>


<div class="price">
Итого: ${sum} TMT
</div>


<div class="quantity">

<button onclick="minus('${doc.id}')">
−
</button>


<span>
${item.quantity}
</span>


<button onclick="plus('${doc.id}')">
+
</button>

</div>


<button class="remove" onclick="removeItem('${doc.id}')">
🗑 Удалить
</button>


</div>

</div>

`;

}


});


totalPrice.innerText = total;


if(cartBox.innerHTML===""){

cartBox.innerHTML="<h2>Корзина пустая 🛒</h2>";

}


}



window.plus=function(id){

let item = cart.find(x=>x.id===id);

if(item){

item.quantity++;

}

save();

}



window.minus=function(id){

let item = cart.find(x=>x.id===id);


if(item){

item.quantity--;


if(item.quantity<=0){

cart = cart.filter(x=>x.id!==id);

}

}


save();

}



window.removeItem=function(id){

cart = cart.filter(x=>x.id!==id);

save();

}



function save(){

localStorage.setItem("cart",JSON.stringify(cart));

window.dispatchEvent(new Event("storage"));

location.reload();

}

renderCart();


</script>


</body>

</html>
