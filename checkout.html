<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Оформление заказа - Brand Outlet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
padding:30px;
}

.box{
max-width:700px;
margin:auto;
background:#1c1c1c;
padding:30px;
border-radius:20px;
}

h1{
text-align:center;
margin-bottom:25px;
}

.product{
display:flex;
align-items:center;
gap:20px;
background:#111;
padding:15px;
border-radius:15px;
margin-bottom:15px;
}

.product img{
width:90px;
height:90px;
object-fit:cover;
border-radius:10px;
}

.info h2{
font-size:18px;
}

.price{
margin-top:8px;
font-size:20px;
}

.total{
font-size:25px;
margin-top:25px;
text-align:right;
}

input, textarea{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:16px;

}

textarea{

height:100px;
resize:none;

}


button{

width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
background:white;
color:black;

}

</style>

</head>


<body>


<div class="box">


<h1>
🛒 <span data-lang="newOrder">Новый заказ</span>
</h1>

<button onclick="window.location.href='cart.html'" style="
background:#333;
color:white;
margin-top:0;
margin-bottom:20px;
">

<span data-lang="backCart">
← Вернуться в корзину
</span>

</button>

<div id="products"></div>


<div class="total">

<span data-lang="total">Итого</span>:
<span id="total">0</span> TMT

</div>


<input id="name" data-lang-placeholder="name" placeholder="Ваше имя">

<input id="phone" data-lang-placeholder="phone" placeholder="Ваш телефон">

<textarea id="address"
data-lang-placeholder="address"
placeholder="Ваш адрес"></textarea>

<p style="margin-top:15px;text-align:center;color:#aaa;font-size:14px;">

⚠️ <span data-lang="returnPolicy">Возврату после покупки не подлежит</span>

</p>

<div style="
    margin-top:20px;
    background:#111;
    padding:18px;
    border-radius:15px;
">

    <h3 style="
        margin-bottom:10px;
        text-align:center;
    ">
        💵 Оплата
    </h3>

    <p style="
        text-align:center;
        color:#ccc;
        font-size:15px;
    ">
        Оплата производится наличными при получении заказа.
    </p>

</div>


<label style="
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-top:20px;
    color:#ccc;
    font-size:14px;
    line-height:1.5;
    cursor:pointer;
">

    <input
        type="checkbox"
        id="orderAgreement"
        style="
            width:20px;
            height:20px;
            margin:0;
            flex-shrink:0;
            cursor:pointer;
        "
    >

    <span>
        Я подтверждаю заказ и согласен с условиями покупки.
        Оплата производится наличными при получении.
    </span>

</label>

<button onclick="makeOrder()">

<span data-lang="confirmOrder">
Подтвердить заказ
</span>

</button>


</div>

<script src="language.js"></script>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
getFirestore,
collection,
getDocs,
doc,
updateDoc,
addDoc
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";



const firebaseConfig={

apiKey:"AIzaSyCc7DmnpKpSabioJg7F-vZ3ZywUfiTsnPQ",

authDomain:"brand-outlet-tm.firebaseapp.com",

projectId:"brand-outlet-tm",

storageBucket:"brand-outlet-tm.firebasestorage.app",

messagingSenderId:"1083598839585",

appId:"1:1083598839585:web:31d6c55768a25a60732860"

};



const app=initializeApp(firebaseConfig);


const db=getFirestore(app);


const auth=getAuth(app);



window.db=db;


let currentUser=null;


onAuthStateChanged(auth,(user)=>{

currentUser=user;

window.currentUser=user;

});



const products=document.getElementById("products");


let cart=JSON.parse(localStorage.getItem("cart")) || [];


let total=0;


window.orderItems=[];



const snapshot=await getDocs(
collection(db,"watches")
);



snapshot.forEach((docSnap)=>{


let item=cart.find(
x=>x.id===docSnap.id
);



if(item){


let watch=docSnap.data();


let sum=watch.price * item.quantity;


total+=sum;



window.orderItems.push({

id:docSnap.id,

name:watch.name,

price:watch.price,

quantity:item.quantity

});



products.innerHTML+=`

<div class="product">


<img src="${watch.images ? watch.images[0] : watch.image}">


<div class="info">


<h2>${watch.name}</h2>


<div class="price">

${watch.price} TMT

</div>


<div>

Количество: ${item.quantity}

</div>


</div>


</div>

`;

}


});



document.getElementById("total").innerText=total;



if(products.innerHTML===""){

let lang = localStorage.getItem("siteLang") || "ru";
products.innerHTML = `<h2>${translations[lang].emptyCart}</h2>`;
}



window.orderTotal=total;



</script>

<script type="module">

import {
collection,
addDoc,
getDocs,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



const BOT_TOKEN="8936062909:AAGtqiRQk13-8m0BhadrkOiQe15T-VE5AFA";

const CHAT_ID="6756528997";



async function makeOrder(){


let name=document.getElementById("name").value;

let phone=document.getElementById("phone").value;

let address=document.getElementById("address").value;



if(!name || !phone || !address){

let lang = localStorage.getItem("siteLang") || "ru";
alert(translations[lang].fillFields);

return;

}

const agreement =
    document.getElementById("orderAgreement").checked;

if(!agreement){

    alert("Пожалуйста, подтвердите условия заказа ☑️");

    return;

}

let cart=JSON.parse(localStorage.getItem("cart")) || [];



if(cart.length===0){

let lang = localStorage.getItem("siteLang") || "ru";
alert(translations[lang].emptyCart);

return;

}




let order={


name:name,

phone:phone,

address:address,

items:window.orderItems,

total:window.orderTotal,

date:new Date().toLocaleString(),

user:window.currentUser ? window.currentUser.email : "Гость"


};





// Сохраняем заказ в Firestore


try{

await addDoc(
collection(window.db,"orders"),
order
);

console.log("Заказ сохранён в Firestore");

}catch(error){

console.log("Ошибка сохранения заказа:",error);

alert(error.message);

return;

}





let message=

"🛒 Новый заказ Brand Outlet\n\n"+

"👤 Имя: "+name+

"\n📱 Телефон: "+phone+

"\n📍 Адрес: "+address+

"\n\n⌚ Товары:\n";





window.orderItems.forEach(item=>{


message+=

"⌚ "+item.name+

"\nКоличество: "+item.quantity+

"\nЦена: "+item.price+" TMT\n\n";


});




message+=

"💰 Сумма: "+

window.orderTotal+

" TMT";







await fetch(

"https://api.telegram.org/bot"+BOT_TOKEN+"/sendMessage",

{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


chat_id:CHAT_ID,

text:message


})


}

);






const snapshot2=await getDocs(

collection(window.db,"watches")

);





for(let item of cart){



let product=snapshot2.docs.find(

d=>d.id===item.id

);




if(product){


let data=product.data();



let newStock=data.stock-item.quantity;



if(newStock<0){

newStock=0;

}




await updateDoc(

doc(window.db,"watches",item.id),

{

stock:newStock

}

);



}



}






let lang = localStorage.getItem("siteLang") || "ru";
alert(translations[lang].orderSent);



localStorage.removeItem("cart");



window.location.href="index.html";



}





window.makeOrder=makeOrder;



</script>



</body>

</html>
