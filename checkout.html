<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Оформление заказа - Brand Outlet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
padding:30px;
}

.box{
max-width:500px;
margin:auto;
background:#1c1c1c;
padding:30px;
border-radius:20px;
}

h1{
text-align:center;
margin-bottom:25px;
}

input, textarea{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:16px;

}

textarea{
height:120px;
resize:none;
}

button{

width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
background:white;
color:black;

}

.info{

margin-top:20px;
color:#ccc;

}

</style>

</head>


<body>


<div class="box">


<h1>
🛒 Оформление заказа
</h1>


<input id="name" placeholder="Ваше имя">


<input id="phone" placeholder="Ваш телефон">


<textarea id="address" placeholder="Ваш адрес"></textarea>


<div class="info">

💵 Оплата: наличными при получении

</div>


<button onclick="makeOrder()">

Подтвердить заказ

</button>


</div>




<script>


function makeOrder(){


let name=document.getElementById("name").value.trim();

let phone=document.getElementById("phone").value.trim();

let address=document.getElementById("address").value.trim();



if(!name || !phone || !address){

alert("Заполните все поля");

return;

}



alert("Заказ отправлен ✅");



}



</script>


</body>

</html>
