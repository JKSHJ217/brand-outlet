<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оформление — brand_outlet.tm</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="style.css"></head><body><header class="navbar-store"><div class="inner"><a class="logo-text" href="index.html">brand_outlet.tm</a><a href="cart.html">← Вернуться в корзину</a></div></header><main class="section"><div class="two"><div class="panel"><h1>Оформление заказа</h1><input id="name" class="field" placeholder="Ваше имя"><input id="phone" class="field" placeholder="Телефон"><input id="address" class="field" placeholder="Адрес доставки"><select id="payment" class="field"><option>Наличными при получении</option></select><textarea id="comment" class="field" rows="5" placeholder="Комментарий"></textarea><button class="primary" onclick="submitOrder()">Подтвердить заказ</button></div><div class="panel"><h2>Ваш заказ</h2><div id="summary"></div></div></div></main><script src="app.js"></script><script type="module" src="firebase.js"></script><script type="module">
import "./firebase.js";document.addEventListener("DOMContentLoaded",()=>{const c=getCart();let t=0;document.getElementById("summary").innerHTML=c.map(x=>{t+=Number(x.price||0)*(x.qty||1);return `<p>${escapeHtml(x.name)} × ${x.qty} — ${money(Number(x.price||0)*(x.qty||1))}</p>`}).join("")+`<hr><h3>${money(t)}</h3>`});
window.submitOrder=async function(){const c=getCart();if(!c.length){alert("Корзина пуста");return}const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim();if(!name||!phone||!address){alert("Заполните имя, телефон и адрес");return}try{const user=store.auth.currentUser;await store.addDoc(store.collection(store.db,"orders"),{name,phone,address,payment:document.getElementById("payment").value,comment:document.getElementById("comment").value.trim(),items:c,total:c.reduce((s,x)=>s+Number(x.price||0)*(x.qty||1),0),email:user?.email||"Гость",status:"new",createdAt:store.serverTimestamp()});localStorage.removeItem("cart");alert("Заказ оформлен!");location.href="orders.html"}catch(e){console.error(e);alert("Не удалось оформить заказ: "+e.message)}}
</script></body></html>
