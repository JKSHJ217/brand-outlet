<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Оформление заказа - Brand Outlet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
padding:30px;
}

.box{
max-width:700px;
margin:auto;
background:#1c1c1c;
padding:30px;
border-radius:20px;
}

h1{
text-align:center;
margin-bottom:25px;
}


.product{

display:flex;
align-items:center;
gap:20px;
background:#111;
padding:15px;
border-radius:15px;
margin-bottom:15px;

}


.product img{

width:90px;
height:90px;
object-fit:cover;
border-radius:10px;

}


.info h2{

font-size:18px;

}


.price{

margin-top:8px;
font-size:20px;

}


.total{

font-size:25px;
margin-top:25px;
text-align:right;

}


input, textarea{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:16px;

}


textarea{

height:100px;
resize:none;

}


button{

width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
background:white;
color:black;

}


</style>

</head>


<body>


<div class="box">


<h1>
🛒 Ваш заказ
</h1>


<div id="products"></div>


<div class="total">

Итого: <span id="total">0</span> TMT

</div>



<input placeholder="Ваше имя">


<input placeholder="Ваш телефон">


<textarea placeholder="Ваш адрес"></textarea>


<p style="margin-top:15px;text-align:center;color:#aaa;font-size:14px;">
⚠️ Возврату после покупки не принадлежит
</p>


<button onclick="makeOrder()">
Подтвердить заказ
</button>



</div>



<script type="module">


import {initializeApp} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {getFirestore,collection,getDocs} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



const firebaseConfig={

apiKey:"AIzaSyCc7DmnpKpSabioJg7F-vZ3ZywUfiTsnPQ",

authDomain:"brand-outlet-tm.firebaseapp.com",

projectId:"brand-outlet-tm",

storageBucket:"brand-outlet-tm.firebasestorage.app",

messagingSenderId:"1083598839585",

appId:"1:1083598839585:web:31d6c55768a25a60732860"

};



const app=initializeApp(firebaseConfig);

const db=getFirestore(app);



const products=document.getElementById("products");


let cart=JSON.parse(localStorage.getItem("cart")) || [];

let total=0;



const snapshot=await getDocs(collection(db,"watches"));



snapshot.forEach(doc=>{


let item=cart.find(x=>x.id===doc.id);



if(item){


let watch=doc.data();


let sum=watch.price * item.quantity;


total+=sum;



products.innerHTML+=`

<div class="product">


<img src="${watch.images ? watch.images[0] : watch.image}">


<div class="info">

<h2>${watch.name}</h2>

<div class="price">
${watch.price} TMT
</div>

<div>
Количество: ${item.quantity}
</div>

</div>


</div>

`;


}


});



document.getElementById("total").innerText=total;



if(products.innerHTML===""){

products.innerHTML="<h2>Корзина пустая 🛒</h2>";

}



</script>

<script>

const BOT_TOKEN = "8936062909:AAGtqiRQk13-8m0BhadrkOiQe15T-VE5AFA";
const CHAT_ID = "6756528997";


async function makeOrder(){


let name = document.querySelectorAll("input")[0].value;

let phone = document.querySelectorAll("input")[1].value;

let address = document.querySelector("textarea").value;



if(!name || !phone || !address){

alert("Заполните все поля");

return;

}



let cart = JSON.parse(localStorage.getItem("cart")) || [];



let message = 
"🛒 Новый заказ Brand Outlet\n\n"+
"👤 Имя: "+name+"\n"+
"📱 Телефон: "+phone+"\n"+
"📍 Адрес: "+address+"\n\n"+
"⌚ Товары:\n";



cart.forEach(item=>{

message += 
"⌚ Ссылка на товар:\n"+
"https://brand-outlet.tm/watch.html?id="+item.id+
"\n"+
"🔢 Количество: "+item.quantity+
"\n\n";

});



message += "💰 Сумма: "+document.getElementById("total").innerText+" TMT";



await fetch(
"https://api.telegram.org/bot"+BOT_TOKEN+"/sendMessage",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

chat_id:CHAT_ID,

text:message

})

}

);



alert("Заказ отправлен ✅");



localStorage.removeItem("cart");


}

</script>

</body>

</html>
