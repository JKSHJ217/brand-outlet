<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Каталог — brand_outlet.tm</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="style.css"></head><body><header class="navbar-store"><div class="inner"><a class="logo-text" href="index.html">brand_outlet.tm</a><nav class="navlinks"><a href="index.html">Главная</a><a href="catalog.html">Каталог</a><a href="favorites.html">❤️ <span data-fav-count>0</span></a><a href="cart.html">🛒 <span data-cart-count>0</span></a><a href="account.html">👤 Аккаунт</a></nav></div></header><main class="section"><div class="muted">COLLECTION</div><h1>Каталог часов</h1><input id="search" class="search" placeholder="Поиск по названию, описанию или цене..." oninput="render()"><div id="products" class="grid" style="margin-top:25px"></div></main><footer>© 2026 brand_outlet.tm</footer><script src="app.js"></script><script type="module" src="firebase.js"></script><script type="module">
import "./firebase.js"; let products=[];
window.addEventListener("load",async()=>{try{const s=await store.getDocs(store.collection(store.db,"watches"));s.forEach(d=>products.push({id:d.id,...d.data()}));render()}catch(e){document.getElementById("products").innerHTML='<p class="muted">Не удалось загрузить товары.</p>'}});
window.render=function(){const q=(document.getElementById("search").value||"").toLowerCase();const a=products.filter(x=>x.status!=="out_of_stock").filter(x=>[x.name,x.description,x.price].join(" ").toLowerCase().includes(q));document.getElementById("products").innerHTML=a.map(card).join("")||'<p class="muted">Ничего не найдено.</p>'}
function card(x){const img=Array.isArray(x.images)?x.images[0]:(x.image||"images/product-item1.jpg");const item={id:x.id,name:x.name||"Часы",price:x.price||0,image:img};return `<article class="card"><a href="watch.html?id=${encodeURIComponent(x.id)}"><img src="${escapeHtml(img)}"></a><div class="card-body"><h3>${escapeHtml(item.name)}</h3><div class="price">${money(item.price)}</div><div class="actions"><button class="primary" onclick='addToCart(${JSON.stringify(item).replace(/'/g,"&#39;")})'>В корзину</button><button class="icon-btn" onclick='toggleFav(${JSON.stringify(item).replace(/'/g,"&#39;")})'>♡</button></div></div></article>`}
</script></body></html>
