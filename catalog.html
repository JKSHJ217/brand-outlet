<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brand Outlet - Каталог</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:#000;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

a{
color:white;
text-decoration:none;
}

.catalog{
padding:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:#1c1c1c;
border-radius:20px;
padding:20px;
text-align:center;
cursor:pointer;
}

.card img{
width:100%;
border-radius:15px;
}

.card h2{
margin:15px 0;
}

.price{
font-size:24px;
margin:15px;
}

button{
width:100%;
background:white;
color:black;
border:none;
padding:12px;
border-radius:10px;
cursor:pointer;
font-size:16px;
margin-top:10px;
}

button:hover{
background:#ddd;
}

</style>

</head>

<body>

<header>

<div class="logo">
brand_outlet.tm
</div>

<div style="display:flex;gap:20px;">

<a href="index.html">
<span data-lang="home">🏠 Главная</span>
</a>

<a href="favorites.html">
<span data-lang="favorites">❤️ Избранное</span>
(<span id="favCount">0</span>)
</a>

<a href="cart.html">
<span data-lang="cart">🛒 Корзина</span>
(<span id="cartCount">0</span>)
</a>

</div>

</header>

<h1 style="text-align:center;margin:30px;">
<span data-lang="catalogTitle">⌚ Каталог часов</span>
</h1>

<div style="padding:20px 40px;">

<input
id="search"
type="text"
data-lang-placeholder="search"
placeholder="🔍 Поиск часов..."
oninput="searchWatches()"
style="width:100%;padding:12px;font-size:16px;border-radius:10px;">

</div>

<section class="catalog" id="catalog">

</section>

<script src="language.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const catalog = document.getElementById("catalog");

let allWatches = [];


const firebaseConfig={

apiKey:"AIzaSyCc7DmnpKpSabioJg7F-vZ3ZywUfiTsnPQ",

authDomain:"brand-outlet-tm.firebaseapp.com",

projectId:"brand-outlet-tm",

storageBucket:"brand-outlet-tm.firebasestorage.app",

messagingSenderId:"1083598839585",

appId:"1:1083598839585:web:31d6c55768a25a60732860"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


const snapshot = await getDocs(
collection(db,"watches")
);


allWatches = snapshot.docs.map(doc => ({
id: doc.id,
...doc.data()
}));


window.allWatches = allWatches;


searchWatches();


function searchWatches(){

let text = document
.getElementById("search")
.value
.toLowerCase()
.trim();


catalog.innerHTML = "";


let lang = localStorage.getItem("siteLang") || "ru";

let t = translations[lang];


allWatches.forEach((watch)=>{

if(watch.stock <= 0) return;


let name = (watch.name || "").toLowerCase();

let description = (watch.description || "").toLowerCase();

let price = String(watch.price);


if(
name.includes(text) ||
description.includes(text) ||
price.includes(text)
){

catalog.innerHTML += `

<div class="card" onclick="openWatch('${watch.id}')">

<img src="${watch.images ? watch.images[0] : watch.image}">

<h2>${watch.name}</h2>

<div class="price">
${watch.price} TMT
</div>

<p>
${watch.description || ""}
</p>

<button onclick="event.stopPropagation(); addToCart('${watch.id}')">
${t.addCart}
</button>

<button onclick="event.stopPropagation(); addToFavorites('${watch.id}')">
${t.addFavorite}
</button>

</div>

`;

}

});

}


window.searchWatches = searchWatches;


</script>

<script>

function openWatch(id){

window.location.href = "watch.html?id=" + id;

}


function addToCart(id){

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let watch = window.allWatches.find(x => x.id === id);


if(!watch){

let lang = localStorage.getItem("siteLang") || "ru";

alert(translations[lang].productNotFound);

return;

}


let item = cart.find(x => x.id === id);


if(item){

if(item.quantity >= watch.stock){

let lang = localStorage.getItem("siteLang") || "ru";

alert(translations[lang].stockFinished);

return;

}

item.quantity++;

}else{

cart.push({
id:id,
quantity:1
});

}


localStorage.setItem("cart", JSON.stringify(cart));


let lang = localStorage.getItem("siteLang") || "ru";

alert(translations[lang].addedCart);

}


function addToFavorites(id){

let favorites =
JSON.parse(localStorage.getItem("favorites")) || [];


if(!favorites.includes(id)){

favorites.push(id);

}


localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);


let lang = localStorage.getItem("siteLang") || "ru";

alert(translations[lang].addedFavorite);

}

</script>

<script src="counter.js"></script>

</body>

</html>
