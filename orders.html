<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заказы — brand_outlet.tm</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="style.css"></head><body><header class="navbar-store"><div class="inner"><a class="logo-text" href="index.html">brand_outlet.tm</a><nav class="navlinks"><a href="catalog.html">Каталог</a><a href="account.html">Аккаунт</a></nav></div></header><main class="section"><h1>📦 Мои заказы</h1><div id="orders"></div></main><script src="app.js"></script><script type="module" src="firebase.js"></script><script type="module">
import "./firebase.js";window.addEventListener("load",()=>{store.onAuthStateChanged(store.auth,async u=>{const r=document.getElementById("orders");if(!u){r.innerHTML='<div class="panel">Войдите в аккаунт, чтобы видеть заказы.</div>';return}try{const s=await store.getDocs(store.collection(store.db,"orders"));const a=[];s.forEach(d=>{const x={id:d.id,...d.data()};if(x.email===u.email)a.push(x)});r.innerHTML=a.length?a.reverse().map(x=>`<div class="panel" style="margin:12px 0"><h3>Заказ #${escapeHtml(x.id.slice(0,8))}</h3><p class="muted">Статус: ${escapeHtml(x.status||"new")}</p><p>${(x.items||[]).map(i=>escapeHtml(i.name)+" × "+i.qty).join("<br>")}</p><strong>${money(x.total)}</strong></div>`).join(""):'<div class="panel">Заказов пока нет.</div>'}catch(e){r.innerHTML='<div class="panel">Не удалось загрузить заказы.</div>';console.error(e)}})});
</script></body></html>
