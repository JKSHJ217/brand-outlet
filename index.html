<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>brand_outlet.tm</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:#000;
}

.logo{
font-size:28px;
font-weight:bold;
}

a{
color:white;
text-decoration:none;
}

.hero{
height:60vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

.hero h1{
font-size:50px;
margin-bottom:20px;
}

.hero p{
font-size:20px;
color:#ccc;
margin-bottom:30px;
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:white;
color:black;
cursor:pointer;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
padding:40px;
}

.card{
background:#1c1c1c;
border-radius:20px;
padding:20px;
text-align:center;
cursor:pointer;
}

.card img{
width:100%;
border-radius:15px;
}

.price{
font-size:24px;
margin:15px 0;
}

.card button{
width:100%;
margin-top:10px;
}

footer{
padding:30px;
text-align:center;
color:#888;
}

</style>

</head>

<body>

<header>

<div class="logo">
brand_outlet.tm
</div>

<div style="display:flex;gap:20px;">

<a href="account.html">
👤 Аккаунт
</a>

<a href="favorites.html">
❤️ Избранное (<span id="favCount">0</span>)
</a>

<a href="cart.html">
🛒 Корзина (<span id="cartCount">0</span>)
</a>

</div>

</header>

<section class="hero">

<h1>
Стиль начинается с часов
</h1>

<p>
Стильные часы для любого образа
</p>

<a href="catalog.html">
<button>
Смотреть каталог
</button>
</a>

</section>

<h1 style="text-align:center;">
⌚ Новинки
</h1>

<div style="padding:20px 40px;">
    <input
        id="search"
        type="text"
        placeholder="🔍 Поиск часов..."
        oninput="searchWatches()"
        style="width:100%;padding:12px;font-size:16px;">
</div>

<section class="products" id="products">

</section>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyCc7DmnpKpSabioJg7F-vZ3ZywUfiTsnPQ",

authDomain:"brand-outlet-tm.firebaseapp.com",

projectId:"brand-outlet-tm",

storageBucket:"brand-outlet-tm.firebasestorage.app",

messagingSenderId:"1083598839585",

appId:"1:1083598839585:web:31d6c55768a25a60732860"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const products = document.getElementById("products");

const snapshot = await getDocs(collection(db,"watches"));

let allWatches = [];

snapshot.forEach((doc)=>{

const watch = doc.data();

watch.id = doc.id;

allWatches.push(watch);

});

window.allWatches = allWatches;

window.searchWatches = function(){

let text = document
.getElementById("search")
.value
.toLowerCase()
.trim();


products.innerHTML = "";


allWatches.forEach((watch)=>{


if(watch.stock <= 0) return;


let name = (watch.name || "").toLowerCase();

let description = (watch.description || "").toLowerCase();

let price = String(watch.price);



if(
name.includes(text) ||
description.includes(text) ||
price.includes(text)
){


products.innerHTML += `

<div class="card" onclick="openWatch('${watch.id}')">

<img src="${watch.images ? watch.images[0] : watch.image}">

<h2>${watch.name}</h2>

<div class="price">${watch.price} TMT</div>

<p>${watch.description || ""}</p>


<button onclick="event.stopPropagation();addToCart('${watch.id}')">
🛒 В корзину
</button>


<button onclick="event.stopPropagation();addToFavorites('${watch.id}')">
❤️ В избранное
</button>


</div>

`;

}

});

}

window.searchWatches();

</script>

<script>

window.openWatch = function(id){

window.location.href="watch.html?id="+id;

}


window.addToCart = function(id){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let watch = window.allWatches.find(x => x.id === id);

    if(!watch){
        alert("Товар не найден");
        return;
    }

    let item = cart.find(x => x.id === id);

    if(item){

        if(item.quantity >= watch.stock){
            alert("На складе больше нет этого товара.");
            return;
        }

        item.quantity++;

    }else{

        cart.push({
            id:id,
            quantity:1
        });

    }

    localStorage.setItem("cart", JSON.stringify(cart));

    alert("Добавлено в корзину 🛒");

}

window.addToFavorites = function(id){

let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

if(!favorites.includes(id)){
favorites.push(id);
}

localStorage.setItem("favorites",JSON.stringify(favorites));


alert("Добавлено в избранное ❤️");

}


</script>

</footer>

    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("Service Worker подключён"))
        .catch(err => console.log(err));
    });
}
</script>

</body>
